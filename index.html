<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="tfs-pwa" content="1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trickfilm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Trickfilm Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Leuchttisch – Werkzeuge links, Bühne in der Mitte, Panel rechts, Zeitleiste (Belichtungsblatt) unten */
:root{
  --bg:#e8ecf1; --panel:#f6f8fb; --raised:#ffffff; --line:#cdd6e1; --fg:#17202b; --muted:#5b6a7b;
  --accent:#2a78cf; --accent-ink:#ffffff; --accent-soft:#d9e8f8; --key:#df9412; --danger:#c43d36;
  --surround:#d3dae3; --cell:#ffffff; --cell-alt:#eef2f7; --onion-prev:#e0483e; --onion-next:#2f9e57;
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'Figtree',-apple-system,'Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --panel:#17202a; --raised:#1e2935; --line:#2b3746; --fg:#e5ecf4; --muted:#8fa0b3;
  --accent:#5ca7f2; --accent-ink:#0a1420; --accent-soft:#1d3550; --key:#f2b13a; --danger:#ec6c63;
  --surround:#0b0f14; --cell:#1b2531; --cell-alt:#16202a; --onion-prev:#ff6b5e; --onion-next:#4fd082; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --panel:#17202a; --raised:#1e2935; --line:#2b3746; --fg:#e5ecf4; --muted:#8fa0b3;
  --accent:#5ca7f2; --accent-ink:#0a1420; --accent-soft:#1d3550; --key:#f2b13a; --danger:#ec6c63;
  --surround:#0b0f14; --cell:#1b2531; --cell-alt:#16202a; --onion-prev:#ff6b5e; --onion-next:#4fd082; color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{-webkit-user-select:text;user-select:text}
button,input,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.solid{fill:currentColor;stroke:none}

#app{height:100%;display:grid;padding-inline:16px;
  grid-template-columns:60px minmax(0,1fr) 316px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "tools stage panel" "tl tl tl"}
#app.nopanel{grid-template-columns:60px minmax(0,1fr) 0}
#app.nopanel #panel{display:none}

/* Top bar */
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding-block:8px;min-width:0;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;min-width:0}
.brand b{font:700 18px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.brand:hover{background:var(--panel)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:1px solid var(--line);background:var(--raised);border-radius:9px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tool:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.icon{padding:0;width:38px;justify-content:center}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
select.sel{height:38px;border:1px solid var(--line);background:var(--raised);border-radius:9px;padding:0 8px;font-weight:600;max-width:200px}
.sep{width:1px;height:24px;background:var(--line);flex:none;margin:0 2px}

/* Tools */
#tools{grid-area:tools;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;overflow-y:auto;scrollbar-width:none}
.tool{width:46px;height:46px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.tool:hover{background:var(--panel)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool svg.i{width:23px;height:23px}
.swatch-btn{width:40px;height:40px;border-radius:50%;border:3px solid var(--raised);box-shadow:0 0 0 1px var(--line);cursor:pointer;margin-top:4px}
.size-ind{font:500 11px var(--f-mono);color:var(--muted)}
.recent{display:flex;flex-direction:column;gap:5px}
.recent button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);cursor:pointer}

/* Stage */
#stageWrap{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--surround);border-radius:14px;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#stageWrap.draw #stage{cursor:crosshair}
.stage-hud{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.hud{height:30px;padding:0 10px;border-radius:15px;border:0;background:color-mix(in srgb,var(--raised) 88%,transparent);color:var(--fg);font:500 12px var(--f-mono);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mode-pill{position:absolute;left:10px;top:10px;padding:5px 10px;border-radius:14px;background:color-mix(in srgb,var(--raised) 88%,transparent);font-size:12px;font-weight:600;color:var(--muted);pointer-events:none}
.mode-pill b{color:var(--accent)}

/* Brush popover */
#brushPop{position:fixed;z-index:30;width:268px;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 32px rgba(10,20,40,.22);display:grid;gap:12px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pal button{aspect-ratio:1;max-width:100%;border-radius:50%;border:1px solid var(--line);cursor:pointer}
.pal button.on{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:10px}
.row label,.lbl{font-size:12px;font-weight:600;color:var(--muted);min-width:64px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--raised)}
.val{font:500 12px var(--f-mono);color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* Panel */
#panel{grid-area:panel;display:flex;flex-direction:column;min-height:0;margin-left:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;height:44px;border:0;background:none;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
#panelBody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
#panelBody h3{margin:0;font:700 15px/1.2 var(--f-display);letter-spacing:-.005em}
.sub{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:9px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.field{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:0 10px}
.field.num{width:76px;font-family:var(--f-mono);font-size:13px}
.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);background:var(--raised);font-size:12.5px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scene-list{display:flex;flex-direction:column;gap:6px}
.scene-item{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;border:1px solid transparent;cursor:pointer;background:none;text-align:left;width:100%}
.scene-item:hover{background:var(--raised)}
.scene-item.on{border-color:var(--accent);background:var(--raised)}
.scene-item canvas{width:80px;height:45px;border-radius:5px;flex:none;border:1px solid var(--line);background:var(--cell)}
.scene-item .meta{min-width:0}
.scene-item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene-item .st{font:500 11.5px var(--f-mono);color:var(--muted)}
.key-state{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;border-radius:9px;background:var(--raised);border:1px solid var(--line)}
.key-state svg{color:var(--key)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.audio-item{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.audio-item .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.inv-item{display:flex;flex-direction:column;gap:4px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--raised);cursor:pointer;min-width:0}
.inv-item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.inv-item img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:6px;background:repeating-conic-gradient(var(--cell-alt) 0 25%,var(--cell) 0 50%) 0 0/14px 14px}
.inv-item span{font-size:11.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-actions{display:grid;gap:9px;padding:12px;border-radius:12px;background:var(--raised);border:1px solid var(--accent)}

/* Timeline */
#tl{grid-area:tl;display:flex;flex-direction:column;padding-block:8px 10px;gap:6px;min-width:0}
#tlbar{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#tlbar::-webkit-scrollbar{display:none}
#frameInfo{font:500 13px var(--f-mono);white-space:nowrap;padding:0 8px;font-variant-numeric:tabular-nums}
#tlWrap{position:relative;height:168px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
#tlCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(8,14,24,.5);display:grid;place-items:center;padding:16px}
.dlg{width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg.wide{width:min(860px,100%)}
.dlg h2{margin:0;font:700 22px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.proj-list{display:flex;flex-direction:column;gap:8px}
.proj{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raised);flex-wrap:wrap}
.proj.on{border-color:var(--accent)}
.proj .meta{flex:1;min-width:140px}
.proj .nm{font-weight:700}
.proj .st{font-size:12px;color:var(--muted)}
.ed-wrap{display:flex;gap:14px;flex-wrap:wrap}
.ed-tools{display:flex;flex-direction:column;gap:6px}
#edCanvas{width:min(420px,72vw,52vh);aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);touch-action:none;background:repeating-conic-gradient(var(--cell-alt) 0 25%,var(--cell) 0 50%) 0 0/24px 24px}
.ed-side{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px}
.progress{height:10px;border-radius:5px;background:var(--cell-alt);overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0}
video.result{width:100%;border-radius:10px;background:#000}

#home{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.home-in{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home-head h1{margin:0;font:700 clamp(30px,5vw,46px)/1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.home-head .hint{margin-top:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px}
.pcard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.pcard.cur{border-color:var(--accent)}
.pthumb{display:block;border:0;padding:0;background:var(--cell);cursor:pointer;aspect-ratio:16/9;width:100%;max-width:100%}
.pthumb img,.pthumb canvas{display:block;width:100%;height:100%;object-fit:cover}
.pthumb:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.pinfo{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px}
.pinfo .meta{flex:1;min-width:0}
.pinfo .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo .st{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.pmenu{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 12px 14px}
.pnew{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:180px;border:2px dashed var(--line);border-radius:14px;background:none;cursor:pointer;color:var(--accent);font-weight:700;font-size:15px}
.pnew svg.i{width:34px;height:34px}
.pnew:hover{border-color:var(--accent);background:var(--panel)}
.home-foot{display:grid;gap:8px;max-width:65ch}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:22px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}

@media (max-width:1100px){
  #app,#app.nopanel{grid-template-columns:56px minmax(0,1fr) 0}
  #panel{position:fixed;z-index:20;right:12px;top:64px;bottom:12px;width:min(340px,calc(100% - 24px));margin:0;transform:translateX(calc(100% + 24px));transition:transform .2s ease;box-shadow:0 16px 40px rgba(10,20,40,.25);display:flex!important}
  #app.showpanel #panel{transform:none}
}
@media (max-width:700px){
  .lbl-t{display:none}
  .btn{padding:0 10px}
  #tlWrap{height:130px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>

<div id="app" class="">
  <header id="top">
    <button class="btn icon" data-a="home" data-ic="home" title="Alle Projekte" aria-label="Alle Projekte"></button>
    <button class="brand" data-a="home" title="Alle Projekte"><b>Trickfilm Studio</b><span id="projName"></span></button>
    <select id="sceneSel" class="sel" aria-label="Szene wählen"></select>
    <button class="btn icon" data-a="undo" id="undoBtn" title="Rückgängig (2-Finger-Tipp)" aria-label="Rückgängig"></button>
    <button class="btn icon" data-a="redo" id="redoBtn" title="Wiederholen" aria-label="Wiederholen"></button>
    <span class="grow"></span>
    <button class="btn" data-a="insImage" data-ic="image"><span class="lbl-t">Foto</span></button>
    <button class="btn" data-a="insVideo" data-ic="video"><span class="lbl-t">Video</span></button>
    <button class="btn" data-a="insAudio" data-ic="audio"><span class="lbl-t">Ton</span></button>
    <span class="sep"></span>
    <button class="btn" data-a="stylus" id="stylusBtn" data-ic="stylus" title="Nur mit dem Stift zeichnen, Finger verschieben"><span class="lbl-t">Nur Stift</span></button>
    <button class="btn" data-a="export" data-ic="export"><span class="lbl-t">Video</span></button>
    <button class="btn icon" data-a="panel" data-ic="panel" title="Panel ein/aus" aria-label="Panel ein/aus"></button>
  </header>

  <nav id="tools" aria-label="Werkzeuge"></nav>

  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div class="mode-pill" id="modePill"></div>
    <div class="stage-hud"><button class="hud" data-a="fit" id="zoomHud">100 %</button></div>
  </div>

  <aside id="panel">
    <div class="tabs" role="tablist">
      <button class="tab" data-a="tab" data-v="scene">Szenen</button>
      <button class="tab" data-a="tab" data-v="obj">Objekt</button>
      <button class="tab" data-a="tab" data-v="inv">Inventar</button>
    </div>
    <div id="panelBody"></div>
  </aside>

  <section id="tl">
    <div id="tlbar">
      <button class="btn icon" data-a="prev" data-ic="prev" title="Vorheriges Bild" aria-label="Vorheriges Bild"></button>
      <button class="btn icon primary" data-a="play" id="playBtn" title="Szene abspielen (Leertaste)" aria-label="Abspielen"></button>
      <button class="btn icon" data-a="next" data-ic="next" title="Nächstes Bild" aria-label="Nächstes Bild"></button>
      <span id="frameInfo"></span>
      <span class="sep"></span>
      <button class="btn sm" data-a="addFrame" data-ic="plus">Bild</button>
      <button class="btn sm" data-a="dupFrame" data-ic="copy">Kopieren</button>
      <button class="btn sm" data-a="delFrame" data-ic="trash">Löschen</button>
      <span class="sep"></span>
      <button class="btn sm" data-a="setKey" id="keyBtn" data-ic="key">Keyframe</button>
      <button class="btn sm" data-a="delKey" id="delKeyBtn">Key löschen</button>
      <span class="sep"></span>
      <button class="btn sm" data-a="onion" id="onionBtn" data-ic="onion">Zwiebelhaut</button>
      <button class="btn sm" data-a="loop" id="loopBtn" data-ic="loop">Schleife</button>
      <button class="btn sm" data-a="film" data-ic="film">Ganzen Film</button>
    </div>
    <div id="tlWrap"><canvas id="tlCanvas"></canvas></div>
  </section>
</div>

<div id="home" hidden></div>
<div id="brushPop" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="fileIn" hidden>

<script>
(function(){
'use strict';
const W=1920,H=1080;
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;};
const fmtS=s=>(Math.round(s*10)/10).toLocaleString('de-DE',{minimumFractionDigits:1})+' s';

/* ---------- Icons ---------- */
const IC={

const DB={db:null,mem:null,
  async open(){
    if(this.db||this.mem) return;
    try{
      this.db=await new Promise((res,rej)=>{const r=indexedDB.open('trickfilm-studio',1);
        r.onupgradeneeded=()=>{const d=r.result;['projects','assets','inventory','meta'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})});};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
    }catch(e){this.mem={projects:new Map(),assets:new Map(),inventory:new Map(),meta:new Map()};
      setTimeout(()=>toast('Speichern ist in diesem Browser blockiert. Änderungen gehen beim Schließen verloren.'),800);}
  },
  async run(store,mode,fn){
    await this.open();
    if(this.mem) return fn(null,this.mem[store]);
    return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);let out;const r=fn(t.objectStore(store));
      if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
  },
  get(st,id){return this.run(st,'readonly',(s,m)=>m?m.get(id):s.get(id));},
  all(st){return this.run(st,'readonly',(s,m)=>m?[...m.values()]:s.getAll());},
  put(st,v){return this.run(st,'readwrite',(s,m)=>m?void m.set(v.id,v):s.put(v));},
  del(st,id){return this.run(st,'readwrite',(s,m)=>m?void m.delete(id):s.delete(id));}
};

function syncMedia(pl,sc,t,playing){
  const f=t*sc.fps;
  for(const o of sc.objects){
    if(o.type!=='video')continue;
    const el=pl.get(o.id,o.assetId,'video');el.muted=!!o.muted;
    const lt=t-(o.inF||0)/sc.fps;
    const vis=lt>=0&&(o.outF==null||f<o.outF+1)&&(!el.duration||lt<el.duration);
    if(playing&&vis){
      if(el.paused){try{el.currentTime=lt;}catch(x){}el.play().catch(()=>{});}
      else if(Math.abs(el.currentTime-lt)>0.3){try{el.currentTime=lt;}catch(x){}}
    }else{
      if(!el.paused)el.pause();
      if(el.readyState>=1){const tg=clamp(lt,0,Math.max(0,(el.duration||1)-0.05));if(Math.abs(el.currentTime-tg)>0.04){try{el.currentTime=tg;}catch(x){}}}
    }
  }
  for(const a of sc.audio){
    const el=pl.get('a_'+a.id,a.assetId,'audio');el.volume=clamp(a.volume??1,0,1);
    const lt=t-(a.start||0);
    const on=playing&&lt>=0&&(!el.duration||lt<el.duration);
    if(on){if(el.paused){try{el.currentTime=lt;}catch(x){}el.play().catch(()=>{});}else if(Math.abs(el.currentTime-lt)>0.3){try{el.currentTime=lt;}catch(x){}}}
    else if(!el.paused)el.pause();
  }
}
function primeMedia(pl,scenes){
  for(const sc of scenes){
    for(const o of sc.objects)if(o.type==='video'){const el=pl.get(o.id,o.assetId,'video');el.muted=!!o.muted;if(el.src){el.play().catch(()=>{});el.pause();}}
    for(const a of sc.audio){const el=pl.get('a_'+a.id,a.assetId,'audio');if(el.src){el.play().catch(()=>{});el.pause();}}
  }
}

let scratch=null;
function strokeBBox(s){
  if(s.t==='fill')return{x:s.x,y:s.y,w:s.w,h:s.h};
  const p=s.p;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<p.length;i+=3){if(p[i]<x0)x0=p[i];if(p[i]>x1)x1=p[i];if(p[i+1]<y0)y0=p[i+1];if(p[i+1]>y1)y1=p[i+1];}
  const pad=s.t==='poly'?2:(s.w||1)*0.7+2;
  return{x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2};
}
function strokesBBox(list){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const s of list){if(s.t==='eraser')continue;const b=strokeBBox(s);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  return x0>x1?null:{x:Math.floor(x0),y:Math.floor(y0),w:Math.ceil(x1-x0)+1,h:Math.ceil(y1-y0)+1};
}
function offsetStrokes(list,dx,dy){
  return list.map(s=>s.t==='fill'?{...s,x:s.x+dx,y:s.y+dy}:{...s,p:s.p.map((v,i)=>i%3===0?r1(v+dx):i%3===1?r1(v+dy):v)});
}
function pathVarWidth(ctx,s){
  const p=s.p,n=p.length/3;
  if(n===1){ctx.beginPath();ctx.arc(p[0],p[1],s.w*p[2]/2,0,Math.PI*2);ctx.fill();return;}
  for(let i=1;i<n;i++){
    const ax=i===1?p[0]:(p[(i-1)*3]+p[i*3])/2, ay=i===1?p[1]:(p[(i-1)*3+1]+p[i*3+1])/2;
    const last=i===n-1;
    const bx=last?p[i*3]:(p[i*3]+p[(i+1)*3])/2, by=last?p[i*3+1]:(p[i*3+1]+p[(i+1)*3+1])/2;
    ctx.beginPath();ctx.moveTo(ax,ay);
    if(last)ctx.lineTo(bx,by);else ctx.quadraticCurveTo(p[i*3],p[i*3+1],bx,by);
    ctx.lineWidth=Math.max(0.5,s.w*p[i*3+2]);ctx.stroke();
  }
}
function pathSmooth(ctx,p){
  const n=p.length/3;ctx.beginPath();ctx.moveTo(p[0],p[1]);
  if(n===1){ctx.lineTo(p[0]+0.01,p[1]);return;}
  for(let i=1;i<n-1;i++){ctx.quadraticCurveTo(p[i*3],p[i*3+1],(p[i*3]+p[(i+1)*3])/2,(p[i*3+1]+p[(i+1)*3+1])/2);}
  ctx.lineTo(p[(n-1)*3],p[(n-1)*3+1]);
}
function drawStroke(ctx,s){
  if(s.t==='fill'){const im=fillImg(s.src);if(im)ctx.drawImage(im,s.x,s.y,s.w,s.h);return;}
  const p=s.p;if(!p||!p.length)return;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  if(s.t==='poly'){
    ctx.fillStyle=s.c;ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=3;i<p.length;i+=3)ctx.lineTo(p[i],p[i+1]);ctx.closePath();ctx.fill();

    ctx.globalCompositeOperation='destination-out';ctx.strokeStyle=ctx.fillStyle='#000';pathVarWidth(ctx,s);
  }else{
    const a=s.a??1;
    if(a<0.999){
      const b=strokeBBox(s);if(!scratch)scratch=mkCanvas(64,64);
      scratch.width=Math.min(4096,Math.ceil(b.w)+2);scratch.height=Math.min(4096,Math.ceil(b.h)+2);
      const x=scratch.getContext('2d');x.clearRect(0,0,scratch.width,scratch.height);x.save();x.translate(-b.x,-b.y);

const fcache=new Map();
function frameCanvas(sc,i,tint){

/* ---------- Keyframes ---------- */
const EASE={linear:u=>u,inout:u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,in:u=>u*u*u,out:u=>1-Math.pow(1-u,3)};
const EASE_NAMES={linear:'Gleichmäßig',inout:'Sanft an & aus',in:'Langsam starten',out:'Langsam enden'};
const TINT0='#ff3b30';
function lerpHex(a,b,u){const A=hexRGB(a),B=hexRGB(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*u).toString(16).padStart(2,'0')).join('');}

function objState(o,ft){
  const k=o.keys;if(!k.length)return{x:W/2,y:H/2,s:1,r:0,o:1,tc:TINT0,ta:0};
  if(ft<=k[0].f)return fullKey(k[0]);const l=k[k.length-1];if(ft>=l.f)return fullKey(l);
  let i=0;while(i<k.length-1&&!(k[i].f<=ft&&ft<k[i+1].f))i++;
  const a=fullKey(k[i]),b=fullKey(k[i+1]),u=(EASE[k[i].e]||EASE.linear)((ft-k[i].f)/(k[i+1].f-k[i].f));
  // Ist eine Seite ungetönt, bleibt die Farbe stehen und nur die Stärke ändert sich
  const tc=a.ta<0.004?b.tc:b.ta<0.004?a.tc:lerpHex(a.tc,b.tc,u);
  return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,s:a.s+(b.s-a.s)*u,r:a.r+(b.r-a.r)*u,o:a.o+(b.o-a.o)*u,tc,ta:a.ta+(b.ta-a.ta)*u};
}
function keyAt(o,F,create){
  let k=o.keys.find(k=>k.f===F);
  if(!k&&create){const st=objState(o,F);const pk=[...o.keys].reverse().find(k=>k.f<F);
    k={f:F,x:st.x,y:st.y,s:st.s,r:st.r,o:st.o,tc:st.tc,ta:st.ta,e:pk?pk.e:'linear'};o.keys.push(k);o.keys.sort((a,b)=>a.f-b.f);}
  return k||null;
}
function keyBefore(o,F){return [...o.keys].reverse().find(k=>k.f<=F)||o.keys[0]||null;}
function objVisible(o,fi){return fi>=(o.inF||0)&&(o.outF==null||fi<=o.outF);}
function beginEdit(o,F){const base={...objState(o,F)};return{o,F,base,orig:o.keys.map(k=>({...k})),key:S.autoKey?keyAt(o,F,true):null};}
function applyVals(E,vals){
  if(E.key){Object.assign(E.key,vals);return;}
  E.o.keys.forEach((k,i)=>{const ok=E.orig[i];
    if('x' in vals)k.x=ok.x+(vals.x-E.base.x);
    if('y' in vals)k.y=ok.y+(vals.y-E.base.y);
    if('s' in vals)k.s=ok.s*(vals.s/(E.base.s||1));
    if('r' in vals)k.r=ok.r+(vals.r-E.base.r);
    if('o' in vals)k.o=clamp(ok.o+(vals.o-E.base.o),0,1);
    if('tc' in vals)k.tc=vals.tc;
    if('ta' in vals)k.ta=clamp((ok.ta||0)+(vals.ta-E.base.ta),0,1);});
}

function drawCover(ctx,im,w,h){const iw=im.naturalWidth||im.videoWidth,ih=im.naturalHeight||im.videoHeight;const s=Math.max(w/iw,h/ih);ctx.drawImage(im,(w-iw*s)/2,(h-ih*s)/2,iw*s,ih*s);}
let tintC=null;
function drawObj(ctx,o,sc,ft,fi,opt){

}

function shiftTime(sc,from,d){

    if(d<0)o.keys=o.keys.length>1?o.keys.filter(k=>k.f!==from):o.keys;
    o.keys.forEach(k=>{if(k.f>from||(d>0&&k.f===from&&false))k.f+=d;});

  }
}
function setLength(sc,n){n=clamp(n|0,1,3000);while(sc.frames.length<n)sc.frames.push([]);sc.frames.length=n;sc.length=n;if(S.frame>=n){S.frame=n-1;S.ft=S.frame;}}
function addFrame(copy){pushUndo();const sc=scene(),i=S.frame;sc.frames.splice(i+1,0,copy?sc.frames[i].slice():[]);sc.length++;shiftTime(sc,i,1);afterEdit();setFrame(i+1);toast(copy?'Bild kopiert':'Neues Bild eingefügt');}
function delFrame(){const sc=scene(),i=S.frame;pushUndo();
  if(sc.length<=1){sc.frames[0]=[];}else{sc.frames.splice(i,1);sc.length--;shiftTime(sc,i,-1);}
  afterEdit();setFrame(Math.min(i,sc.length-1));}

/* ---------- Abspielen ---------- */
let play=null;
function startPlayback(film){
  if(S.playing){stopPlayback();return;}
  if(!S.project)return;
  const scenes=film?S.project.scenes:[scene()];
  primeMedia(pool,scenes);
  if(film){S.si=0;refreshScenes();}
  const sc=scene();
  let start=film?0:S.frame/sc.fps;if(!film&&S.frame>=sc.length-1)start=0;
  S.playing=true;play={film,t0:performance.now(),start};pool.pauseAll();updatePlayBtn();
  requestAnimationFrame(tick);
}
function tick(now){
  if(!S.playing)return;
  let sc=scene();let t=(now-play.t0)/1000+play.start;
  if(t>=sc.length/sc.fps){
    pool.pauseAll();play.t0=now;play.start=0;t=0;
    if(play.film&&S.si<S.project.scenes.length-1){S.si++;refreshScenes();}
    else if(S.loop){if(play.film){S.si=0;refreshScenes();}}
    else{stopPlayback();setFrame(sc.length-1);return;}
    sc=scene();
  }
  S.ft=t*sc.fps;S.frame=Math.min(sc.length-1,Math.floor(S.ft));
  syncMedia(pool,sc,t,true);render();ensureVisible();drawTimeline();updateFrameInfo();
  requestAnimationFrame(tick);
}
function stopPlayback(){S.playing=false;pool.pauseAll();S.ft=S.frame;updatePlayBtn();requestRender();drawTimeline();}
function updatePlayBtn(){$('#playBtn').innerHTML=icon(S.playing?'pause':'play');}

/* ---------- Zeitleiste ---------- */
const tl=$('#tlCanvas'),tctx=tl.getContext('2d');
const TL={w:0,h:0,sx:0,sy:0,CW:26,RH:28,RUL:22,LW:118,drag:null};
function resizeTl(){const r=tl.getBoundingClientRect();TL.w=r.width;TL.h=r.height;TL.LW=r.width<560?84:118;tl.width=Math.round(r.width*dpr);tl.height=Math.round(r.height*dpr);drawTimeline();}
function tlRows(){const sc=scene();const rows=[{k:'frames'}];for(let i=sc.objects.length-1;i>=0;i--)rows.push({k:'obj',o:sc.objects[i]});for(const a of sc.audio)rows.push({k:'audio',a});return rows;}
function audioDur(a){const el=pool.m.get('a_'+a.id);return(el&&isFinite(el.duration)&&el.duration)||a.dur||2;}
function ensureVisible(){const x=S.ft*TL.CW;const vw=TL.w-TL.LW;if(x<TL.sx)TL.sx=Math.max(0,x-TL.CW*2);else if(x+TL.CW>TL.sx+vw)TL.sx=x-vw+TL.CW*3;}
let tlq=false;
function drawTimeline(){if(tlq)return;tlq=true;requestAnimationFrame(()=>{tlq=false;paintTimeline();});}
function paintTimeline(){
  if(!S.project||!TL.w)return;
  const c=tctx,sc=scene(),{CW,RH,RUL,LW}=TL,w=TL.w,h=TL.h,rows=tlRows();
  TL.sy=clamp(TL.sy,0,Math.max(0,RUL+rows.length*RH-h));
  c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle=T.panel;c.fillRect(0,0,w,h);
  const i0=Math.max(0,Math.floor(TL.sx/CW)),i1=Math.min(sc.length-1,Math.ceil((TL.sx+w-LW)/CW));
  const X=i=>LW+i*CW-TL.sx;
  c.save();c.beginPath();c.rect(LW,RUL,w-LW,h-RUL);c.clip();
  rows.forEach((r,idx)=>{
    const y=RUL+idx*RH-TL.sy;if(y>h||y+RH<RUL)return;
    const isSel=r.k==='obj'&&r.o.id===S.sel;
    c.fillStyle=isSel?T.accentSoft:(idx%2?T.cellAlt:T.cell);c.fillRect(LW,y,w-LW,RH);
    c.strokeStyle=T.line;c.lineWidth=1;
    if(r.k==='frames'){
      for(let i=i0;i<=i1;i++){const x=X(i);c.strokeRect(x+.5,y+.5,CW,RH);
        const n=sc.frames[i].length;if(n){c.fillStyle=T.fg;c.beginPath();c.arc(x+CW/2,y+RH/2,Math.min(7,3+n*0.4),0,Math.PI*2);c.fill();}
        else{c.fillStyle=T.line;c.beginPath();c.arc(x+CW/2,y+RH/2,2,0,Math.PI*2);c.fill();}}
    }else if(r.k==='obj'){
      const o=r.o,a=o.inF||0,b=o.outF==null?sc.length-1:o.outF;
      c.globalAlpha=.25;c.fillStyle=T.accent;c.fillRect(X(a),y+RH/2-6,(b-a+1)*CW,12);c.globalAlpha=1;
      c.strokeStyle=T.key;c.lineWidth=2;
      for(let k=0;k<o.keys.length-1;k++){c.beginPath();c.moveTo(X(o.keys[k].f)+CW/2,y+RH/2);c.lineTo(X(o.keys[k+1].f)+CW/2,y+RH/2);c.stroke();}
      for(const k of o.keys){const x=X(k.f)+CW/2,d=k.f===S.frame?8:6.5;c.fillStyle=T.key;c.beginPath();c.moveTo(x,y+RH/2-d);c.lineTo(x+d,y+RH/2);c.lineTo(x,y+RH/2+d);c.lineTo(x-d,y+RH/2);c.closePath();c.fill();
        if(TL.drag&&TL.drag.k===k){c.strokeStyle=T.fg;c.lineWidth=1.5;c.stroke();c.strokeStyle=T.key;c.lineWidth=2;}}
    }else{
      const a=r.a,x=X((a.start||0)*sc.fps),bw=audioDur(a)*sc.fps*CW;
      c.fillStyle=T.accent;c.globalAlpha=.8;roundRect(c,x,y+5,bw,RH-10,6);c.fill();c.globalAlpha=1;
      c.fillStyle=T.raised;c.font=`600 11px ${T.body}`;c.save();c.beginPath();c.rect(x,y,bw,RH);c.clip();c.fillText('♪ '+a.name,x+7,y+RH/2+4);c.restore();
    }
  });
  const xe=X(sc.length);c.fillStyle=T.panel;c.fillRect(xe,RUL,w,h);
  c.fillStyle=T.accent;c.globalAlpha=.14;c.fillRect(X(S.frame),RUL,CW,h);c.globalAlpha=1;
  c.restore();
  // ruler
  c.fillStyle=T.panel;c.fillRect(LW,0,w-LW,RUL);c.strokeStyle=T.line;c.beginPath();c.moveTo(LW,RUL-.5);c.lineTo(w,RUL-.5);c.stroke();
  c.save();c.beginPath();c.rect(LW,0,w-LW,RUL);c.clip();
  c.font=`500 10px ${T.mono}`;c.textAlign='center';
  for(let i=i0;i<=i1;i++){const x=X(i);const sec=i%sc.fps===0;
    if(sec&&i>0){c.fillStyle=T.accent;c.fillRect(x,0,1.5,RUL);c.fillText((i/sc.fps)+'s',x+CW/2,14);}
    else if((i+1)%5===0||i===0){c.fillStyle=T.muted;c.fillText(String(i+1),x+CW/2,14);}}
  c.restore();
  // playhead
  const px=LW+(S.ft+.5)*CW-TL.sx;if(px>=LW&&px<=w){c.strokeStyle=T.danger;c.lineWidth=2;c.beginPath();c.moveTo(px,0);c.lineTo(px,h);c.stroke();}
  // labels
  c.fillStyle=T.panel;c.fillRect(0,0,LW,h);c.strokeStyle=T.line;c.beginPath();c.moveTo(LW-.5,0);c.lineTo(LW-.5,h);c.stroke();
  c.fillStyle=T.muted;c.font=`700 10px ${T.body}`;c.textAlign='left';c.fillText('EBENEN',10,15);
  c.save();c.beginPath();c.rect(0,RUL,LW,h-RUL);c.clip();
  rows.forEach((r,idx)=>{const y=RUL+idx*RH-TL.sy;if(y>h||y+RH<RUL)return;
    const isSel=r.k==='obj'&&r.o.id===S.sel;
    if(isSel){c.fillStyle=T.accentSoft;c.fillRect(0,y,LW-1,RH);}
    c.fillStyle=isSel?T.accent:T.fg;c.font=`${isSel?700:600} 12px ${T.body}`;
    const label=r.k==='frames'?'✎ Zeichnung':r.k==='obj'?(({image:'▣ ',video:'▶ ',drawing:'◇ '})[r.o.type]||'')+r.o.name:'♪ '+r.a.name;
    c.fillText(fitText(c,label,LW-16),10,y+RH/2+4);});
  c.restore();
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fitText(c,t,mw){if(c.measureText(t).width<=mw)return t;while(t.length>1&&c.measureText(t+'…').width>mw)t=t.slice(0,-1);return t+'…';}
tl.addEventListener('pointerdown',e=>{
  if(!S.project)return;if(S.playing)stopPlayback();
  const r=tl.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;try{tl.setPointerCapture(e.pointerId);}catch(z){}
  const sc=scene(),rows=tlRows(),{CW,RH,RUL,LW}=TL;
  const ri=Math.floor((y-RUL+TL.sy)/RH),row=y>=RUL?rows[ri]:null;const fpos=(x-LW+TL.sx)/CW;
  const D={id:e.pointerId,x0:x,y0:y,sx0:TL.sx,sy0:TL.sy,moved:false,row,fpos,mode:'tap'};
  if(x<LW){D.mode='label';}
  else if(y<RUL){D.mode='scrub';setFrame(Math.floor(fpos));}
  else if(row&&row.k==='obj'){const k=row.o.keys.find(k=>Math.abs(LW+(k.f+.5)*CW-TL.sx-x)<13);if(k){D.mode='key';D.k=k;D.o=row.o;D.f0=k.f;select(row.o.id,true);}}
  else if(row&&row.k==='audio'){const st=(row.a.start||0)*sc.fps;if(fpos>=st&&fpos<=st+audioDur(row.a)*sc.fps){D.mode='audio';D.a=row.a;D.st0=row.a.start||0;}}
  TL.drag=D;drawTimeline();
});
tl.addEventListener('pointermove',e=>{
  const D=TL.drag;if(!D||D.id!==e.pointerId)return;const r=tl.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const dx=x-D.x0,dy=y-D.y0;if(Math.hypot(dx,dy)>6)D.moved=true;const sc=scene();
  if(D.mode==='scrub'){setFrame(Math.floor((x-TL.LW+TL.sx)/TL.CW));}
  else if(D.mode==='key'){if(!D.moved)return;if(!D.pushed){pushUndo();D.pushed=true;D.k=D.o.keys.find(k=>k.f===D.f0);}
    D.k.f=Math.max(0,Math.round(D.f0+dx/TL.CW));D.o.keys.sort((a,b)=>a.f-b.f);requestRender();drawTimeline();}
  else if(D.mode==='audio'){if(!D.moved)return;if(!D.pushed){pushUndo();D.pushed=true;D.a=scene().audio.find(a=>a.id===D.a.id);}
    D.a.start=Math.max(0,Math.round(D.st0*sc.fps+dx/TL.CW)/sc.fps);drawTimeline();}
  else if(D.moved){TL.sx=clamp(D.sx0-dx,0,Math.max(0,sc.length*TL.CW-(TL.w-TL.LW)+TL.CW*3));TL.sy=D.sy0-dy;drawTimeline();}
});
function tlUp(e){
  const D=TL.drag;if(!D||D.id!==e.pointerId)return;TL.drag=null;
  if(D.mode==='key'&&D.pushed){const o=D.o;const dup=o.keys.filter(k=>k.f===D.k.f);if(dup.length>1)o.keys=o.keys.filter(k=>k===D.k||k.f!==D.k.f);setFrame(D.k.f);afterEdit();renderPanel();return;}
  if(D.mode==='audio'&&D.pushed){afterEdit();renderPanel();return;}
  if(!D.moved&&e.type==='pointerup'){
    if(D.row&&D.row.k==='obj')select(D.row.o.id,true);
    if(D.mode!=='label')setFrame(Math.floor(D.fpos));
    if(D.mode==='key')setFrame(D.f0);
  }
  drawTimeline();
}
tl.addEventListener('pointerup',tlUp);tl.addEventListener('pointercancel',tlUp);
tl.addEventListener('wheel',e=>{e.preventDefault();TL.sx=Math.max(0,TL.sx+(e.deltaX||e.deltaY));if(e.shiftKey)TL.sy+=e.deltaY;drawTimeline();},{passive:false});

/* ---------- Auswahl & Keyframe-Aktionen ---------- */
function select(id,keepTab){S.sel=id;if(id&&!keepTab&&S.tab!=='inv')S.tab='obj';if(id&&keepTab&&S.tab==='scene')S.tab='obj';renderPanel();requestRender();drawTimeline();updateFrameInfo();}
function setKey(){const o=selObj();if(!o){toast('Erst ein Objekt auswählen');return;}pushUndo();keyAt(o,S.frame,true);afterEdit();renderPanel();toast('Keyframe auf Bild '+(S.frame+1));}
function delKey(){const o=selObj();if(!o)return;const k=o.keys.find(k=>k.f===S.frame);if(!k)return;if(o.keys.length===1){toast('Der letzte Keyframe bleibt, er hält die Position.');return;}
  pushUndo();o.keys=o.keys.filter(x=>x!==k);afterEdit();renderPanel();}

/* ---------- Einfügen ---------- */
const fileIn=$('#fileIn');let fileCb=null;
fileIn.addEventListener('change',()=>{const f=[...fileIn.files];fileIn.value='';if(f.length&&fileCb)fileCb(f);});
function pick(accept,cb,multi){fileIn.accept=accept;fileIn.multiple=!!multi;fileCb=cb;fileIn.click();}
function fit(nw,nh,mw=W*0.55,mh=H*0.55){const s=Math.min(1,mw/nw,mh/nh);return{w:Math.round(nw*s),h:Math.round(nh*s)};}
function newObj(type,name,w,h,extra){const o={id:uid(),type,name,w,h,inF:0,outF:null,behind:false,flip:false,keys:[{f:S.frame,x:W/2,y:H/2,s:1,r:0,o:1,e:'linear'}],...extra};return o;}
function addObject(o){pushUndo();scene().objects.push(o);S.tool==='select'||setTool('select');select(o.id);afterEdit();}
async function insertImageFiles(files){
  for(const f of files){try{const id=await addAsset(f,'image');const e=await assetUrl(id);const im=await loadImageFromUrl(e.url);images.set(id,im);
    const s=fit(im.naturalWidth,im.naturalHeight);addObject(newObj('image',(f.name||'Foto').replace(/\.[^.]+$/,''),s.w,s.h,{assetId:id}));}
  catch(err){toast('Dieses Bild lässt sich nicht öffnen.');}}
}
async function insertVideoFile([f]){
  try{const id=await addAsset(f,'video');const e=await assetUrl(id);
    const v=document.createElement('video');v.preload='metadata';v.muted=true;v.playsInline=true;v.src=e.url;
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej;setTimeout(res,6000);});
    const s=fit(v.videoWidth||640,v.videoHeight||360,W*0.7,H*0.7);
    const o=newObj('video',(f.name||'Video').replace(/\.[^.]+$/,''),s.w,s.h,{assetId:id,muted:false});
    const sc=scene();o.inF=S.frame;o.keys[0].f=S.frame;
    if(isFinite(v.duration)&&v.duration>0){const need=S.frame+Math.ceil(v.duration*sc.fps);if(need>sc.length&&need<=3000){pushUndo();setLength(sc,need);toast('Szene auf Videolänge verlängert');}}
    addObject(o);
  }catch(err){toast('Dieses Video lässt sich nicht öffnen. Safari kann MP4 und MOV abspielen.');}
}
async function insertAudioFile([f]){
  try{const id=await addAsset(f,'audio');const e=await assetUrl(id);const a=document.createElement('audio');a.preload='metadata';a.src=e.url;
    await new Promise(res=>{a.onloadedmetadata=res;a.onerror=res;setTimeout(res,6000);});
    pushUndo();const sc=scene();sc.audio.push({id:uid(),assetId:id,name:(f.name||'Ton').replace(/\.[^.]+$/,''),start:S.frame/sc.fps,volume:1,dur:isFinite(a.duration)?a.duration:2});
    S.tab='scene';afterEdit();renderPanel();toast('Ton ab Bild '+(S.frame+1)+' eingefügt');
  }catch(err){toast('Diese Tondatei lässt sich nicht öffnen.');}
}
function frameToObject(){
  const sc=scene(),arr=sc.frames[S.frame];if(!arr.length){toast('Auf diesem Bild ist noch nichts gezeichnet.');return;}
  const b=strokesBBox(arr);if(!b)return;pushUndo();
  const o=newObj('drawing','Zeichnung '+(sc.objects.filter(o=>o.type==='drawing').length+1),b.w,b.h,{strokes:offsetStrokes(arr,-b.x,-b.y)});
  o.keys[0].x=b.x+b.w/2;o.keys[0].y=b.y+b.h/2;sc.frames[S.frame]=[];sc.objects.push(o);setTool('select');select(o.id);afterEdit();toast('Zeichnung ist jetzt ein Objekt. Verschieben setzt Keyframes.');
}

/* ---------- Inventar ---------- */
function makeThumb(drawFn,w,h){const c=mkCanvas(160,160),x=c.getContext('2d');const s=Math.min(144/w,144/h);x.translate(80-w*s/2,80-h*s/2);x.scale(s,s);drawFn(x);return c.toDataURL('image/png');}
async function saveInv(item){await DB.put('inventory',item);const i=inventory.findIndex(x=>x.id===item.id);if(i>=0)inventory[i]=item;else inventory.push(item);}
async function invFromObject(){

async function invFromFrame(){

/* ---------- Panel ---------- */
const PB=$('#panelBody');
function renderPanel(){
  if(!S.project)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===S.tab));
  if(S.tab==='scene')PB.innerHTML=panelScene();else if(S.tab==='obj')PB.innerHTML=panelObj();else PB.innerHTML=panelInv();
  if(S.tab==='scene')PB.querySelectorAll('canvas[data-thumb]').forEach(c=>{const sc=S.project.scenes[+c.dataset.thumb];const x=c.getContext('2d');x.setTransform(c.width/W,0,0,c.height/H,0,0);drawScene(x,sc,0,{pool});});
}
function panelScene(){
  const sc=scene();
  const list=S.project.scenes.map((s,i)=>`<button class="scene-item ${i===S.si?'on':''}" data-a="sceneGo" data-i="${i}"><canvas width="160" height="90" data-thumb="${i}"></canvas><span class="meta"><div class="nm">${esc(s.name)}</div><div class="st">${s.fps} fps · ${s.length} Bilder · ${fmtS(s.length/s.fps)}</div></span></button>`).join('');
  const fpsChips=[6,8,12,15,24,30].map(f=>`<button class="chip ${sc.fps===f?'on':''}" data-a="fps" data-v="${f}">${f}</button>`).join('');
  const bgs=['#ffffff','#f4efe4','#bfe3f7','#1b2142','#2b2b2b','#cfe8c4'].map(c=>`<button class="chip" data-a="bgc" data-v="${c}" style="width:30px;padding:0;background:${c}" aria-label="Hintergrund ${c}"></button>`).join('');
  const audio=sc.audio.map(a=>`<div class="audio-item"><div class="row"><span class="nm" style="flex:1">♪ ${esc(a.name)}</span><button class="btn sm danger" data-a="audioDel" data-id="${a.id}">${icon('trash')}</button></div>
    <div class="row"><label for="au-s-${a.id}">Start</label><input id="au-s-${a.id}" class="field num" type="number" step="0.1" min="0" value="${(a.start||0).toFixed(2)}" data-au="start" data-id="${a.id}"><span class="val">s</span></div>

PB.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.tr){const o=selObj();if(!o)return;const p=t.dataset.tr;
    if(!PB._edit){pushUndo();PB._edit=beginEdit(o,S.frame);}
    const vals={};
    if(p==='tc'){vals.tc=t.value;if(PB._edit.base.ta<0.004&&!PB._edit.tintBumped){vals.ta=0.5;PB._edit.tintBumped=true;}}
    else{const v=+t.value;vals[p]=(p==='s'||p==='o'||p==='ta')?v/100:v;const u={s:'%',o:'%',ta:'%',r:'°'}[p]||'';$('#trv-'+p).textContent=Math.round(v)+u;}
    applyVals(PB._edit,vals);requestRender();drawTimeline();updateFrameInfo();}
  else if(t.dataset.au==='volume'){const a=scene().audio.find(a=>a.id===t.dataset.id);if(a){a.volume=+t.value/100;scheduleSave();}}
  else if(t.dataset.sc==='bg'){scene().bg=t.value;requestRender();scheduleSave();}
});
PB.addEventListener('change',e=>{
  const t=e.target,sc=scene();
  if(t.dataset.tr){PB._edit=null;afterEdit();renderPanel();return;}
  if(t.dataset.sc){const f=t.dataset.sc;
    if(f==='name'){sc.name=t.value.trim()||sc.name;refreshScenes();}
    else if(f==='fps'){pushUndo();sc.fps=clamp(Math.round(+t.value)||12,1,60);}
    else if(f==='length'){pushUndo();setLength(sc,+t.value);}
    else if(f==='bg'){sc.bg=t.value;}
    afterEdit();renderPanel();refreshScenes();return;}
  if(t.dataset.au==='start'){const a=sc.audio.find(a=>a.id===t.dataset.id);if(a){pushUndo();a.start=Math.max(0,+t.value||0);afterEdit();}return;}
  if(t.dataset.au==='volume')return;
  if(t.dataset.ob){const o=selObj();const f=t.dataset.ob;
    if(f==='autoKey'){S.autoKey=t.checked;LS.set('autoKey',S.autoKey);return;}
    if(!o)return;pushUndo();
    if(f==='name')o.name=t.value.trim()||o.name;
    else if(f==='ease'){const kb=keyBefore(o,S.frame);if(kb)kb.e=t.value;}
    else if(f==='inF')o.inF=clamp((+t.value||1)-1,0,sc.length-1);
    else if(f==='outF')o.outF=t.value===''?null:clamp((+t.value||1)-1,o.inF||0,sc.length-1);
    else if(f==='behind')o.behind=t.checked;
    else if(f==='muted')o.muted=t.checked;
    afterEdit();renderPanel();return;}
  if(t.dataset.inv){const it=inventory.find(i=>i.id===S.invSel);if(!it)return;it[t.dataset.inv]=t.value.trim()||(t.dataset.inv==='cat'?'Eigene':it.name);if(t.dataset.inv==='cat')S.invCat='Alle';saveInv(it).then(renderPanel);}
});

  export:openExport,panel:()=>{const app=$('#app');if(innerWidth<=1100)app.classList.toggle('showpanel');else app.classList.toggle('nopanel');setTimeout(()=>{resizeStage();resizeTl();},30);},

  sceneDup:()=>{pushUndo();const c=JSON.parse(JSON.stringify(scene()));c.id=uid();c.name=scene().name+' (Kopie)';c.objects.forEach(o=>o.id=uid());c.audio.forEach(a=>a.id=uid());S.project.scenes.splice(S.si+1,0,c);switchScene(S.si+1);afterEdit();},
  sceneUp:()=>{if(S.si<1)return;pushUndo();const a=S.project.scenes;[a[S.si-1],a[S.si]]=[a[S.si],a[S.si-1]];S.si--;refreshScenes();renderPanel();afterEdit();},
  sceneDown:()=>{const a=S.project.scenes;if(S.si>=a.length-1)return;pushUndo();[a[S.si+1],a[S.si]]=[a[S.si],a[S.si+1]];S.si++;refreshScenes();renderPanel();afterEdit();},
  sceneDel:async()=>{if(S.project.scenes.length<2)return;if(!await confirmDlg(`Szene „${scene().name}“ löschen?`,'Löschen'))return;pushUndo();S.project.scenes.splice(S.si,1);switchScene(Math.max(0,S.si-1));afterEdit();},
  fps:el=>{pushUndo();scene().fps=+el.dataset.v;afterEdit();renderPanel();},
  bgc:el=>{pushUndo();scene().bg=el.dataset.v;afterEdit();renderPanel();},
  bgImage:()=>pick('image/*',async([f])=>{try{const id=await addAsset(f,'image');await assetUrl(id);pushUndo();scene().bgAsset=id;afterEdit();renderPanel();}catch(e){toast('Dieses Bild lässt sich nicht öffnen.');}}),
  bgClear:()=>{pushUndo();scene().bgAsset=null;afterEdit();renderPanel();},

  frameToObj:frameToObject,
  keyPrev:()=>{const o=selObj();if(!o)return;const k=[...o.keys].reverse().find(k=>k.f<S.frame);if(k)setFrame(k.f);},
  keyNext:()=>{const o=selObj();if(!o)return;const k=o.keys.find(k=>k.f>S.frame);if(k)setFrame(k.f);},

  visTo:()=>{const o=selObj();if(!o)return;pushUndo();o.outF=Math.max(S.frame,o.inF||0);afterEdit();renderPanel();},

  objFlip:()=>{const o=selObj();if(!o)return;pushUndo();o.flip=!o.flip;afterEdit();renderPanel();},

  objDup:()=>{const o=selObj();if(!o)return;const c=JSON.parse(JSON.stringify(o));c.id=uid();c.name=o.name+' 2';c.strokes=o.strokes;c.keys.forEach(k=>{k.x+=40;k.y+=40;});addObject(c);},
  objDel:()=>{const o=selObj();if(!o)return;pushUndo();const sc=scene();sc.objects=sc.objects.filter(x=>x!==o);S.sel=null;afterEdit();renderPanel();toast('Objekt gelöscht');},

async function gcAssets(){try{const used=new Set();const ps=await DB.all('projects');
  const walk=p=>p.scenes.forEach(s=>{if(s.bgAsset)used.add(s.bgAsset);s.objects.forEach(o=>o.assetId&&used.add(o.assetId));s.audio.forEach(a=>used.add(a.assetId));});
  ps.forEach(walk);if(S.project)walk(S.project);inventory.forEach(i=>i.assetId&&used.add(i.assetId));
  for(const a of await DB.all('assets'))if(!used.has(a.id))await DB.del('assets',a.id);}catch(e){}}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
function dataURLToBlob(u){const [h,d]=u.split(',');const mime=(/data:([^;]+)/.exec(h)||[])[1]||'application/octet-stream';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}
async function backup(only,all){
  if(S.project)await saveNow();toast('Sicherung wird erstellt …');
  const projects=all?await DB.all('projects'):only;const ids=new Set();
  projects.forEach(p=>p.scenes.forEach(s=>{if(s.bgAsset)ids.add(s.bgAsset);s.objects.forEach(o=>o.assetId&&ids.add(o.assetId));s.audio.forEach(a=>ids.add(a.assetId));}));
  const inv=all?inventory:[];inv.forEach(i=>i.assetId&&ids.add(i.assetId));
  const assets=[];for(const id of ids){const a=await DB.get('assets',id);if(a)assets.push({id:a.id,type:a.type,name:a.name,data:await blobToDataURL(a.blob)});}
  const data=JSON.stringify({app:'trickfilm-studio',version:1,saved:new Date().toISOString(),projects,inventory:inv,assets});
  const name=all?'Trickfilm-Sicherung-'+new Date().toISOString().slice(0,10)+'.json':(projects[0].name.replace(/[^\w\-äöüÄÖÜß ]+/g,'')||'Projekt')+'.json';
  await saveFile(name,new Blob([data],{type:'application/json'}));
}
async function importBackup([f]){
  try{const j=JSON.parse(await f.text());if(j.app!=='trickfilm-studio')throw new Error('Das ist keine Trickfilm-Studio-Sicherung.');
    for(const a of j.assets||[])await DB.put('assets',{id:a.id,type:a.type,name:a.name,blob:dataURLToBlob(a.data)});
    for(const p of j.projects||[])await DB.put('projects',p);
    for(const i of j.inventory||[])await saveInv(i);
    toast(`Geladen: ${(j.projects||[]).length} Projekt(e), ${(j.inventory||[]).length} Inventar-Teile`);
    if(S.project&&(j.projects||[]).some(x=>x.id===S.project.id)){clearTimeout(saveT);saveT=null;pool.clear();S.project=null;}
    if(isHome())renderHome();else showHome();
  }catch(e){toast('Sicherung konnte nicht geladen werden. '+(e.message||''));}
}
async function saveFile(filename,blob){
  try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename,data:blob});toast('Gespeichert: '+filename);return;}}}
  catch(err){const c=err&&err.code;if(c==='declined'){toast('Speichern abgebrochen');return;}if(c==='rate_limited'){toast('Bitte kurz warten und nochmal tippen.');return;}
    if(c&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){toast('Speichern ging nicht: '+(err.message||c));return;}}
  let file=null;try{file=new File([blob],filename,{type:blob.type});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return;}
    catch(err){
      if(err&&err.name==='AbortError')return;
      if(err&&err.name==='NotAllowedError'){
        const d=openModal(`<h2>Datei ist fertig</h2><p class="hint">${esc(filename)} · ${(blob.size/1048576).toFixed(1)} MB. Tippe auf „Sichern“ und wähle „In Dateien sichern“${/\.(mp4|webm)$/.test(filename)?' oder „Video sichern“':''}.</p><div class="foot"><button class="btn" id="sf-no">Abbrechen</button><button class="btn primary" id="sf-ok">${icon('export')}Sichern</button></div>`);
        d.querySelector('#sf-no').onclick=closeModal;
        d.querySelector('#sf-ok').onclick=()=>{navigator.share({files:[file],title:filename}).then(closeModal,e=>{if(!e||e.name!=='AbortError')toast('Teilen ging nicht.');});};
        return;
      }
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},5000);
}

  const d=openModal(`<h2>Als Video speichern</h2>

    <div class="grp"><div class="sub">Bewegung</div><div class="chips"><button class="chip" data-x="fps" data-v="30">30 fps</button><button class="chip on" data-x="fps" data-v="60">60 fps</button></div>
    <p class="hint">Die gezeichneten Bilder behalten die fps jeder Szene. Keyframe-Bewegungen werden mit 30 oder 60 fps aufgenommen. Der Film läuft dabei einmal in Echtzeit durch.</p></div>
    <div class="progress" hidden><div></div></div><div id="ex-out" class="grp"></div>
    <div class="foot"><button class="btn" id="ex-cancel">Schließen</button><button class="btn primary" id="ex-go">${icon('film')}Aufnahme starten</button></div>`);
  const opt={range:'film',res:1280,fps:60};
  d.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{d.querySelectorAll(`[data-x="${b.dataset.x}"]`).forEach(x=>x.classList.toggle('on',x===b));opt[b.dataset.x]=b.dataset.x==='range'?b.dataset.v:+b.dataset.v;});
  let job=null;
  d.querySelector('#ex-cancel').onclick=()=>{if(job)job.cancel();modal.dataset.lock='';closeModal();};
  d.querySelector('#ex-go').onclick=e=>{e.currentTarget.disabled=true;modal.dataset.lock='1';job=runExport(opt,d);};
}
function runExport(opt,d){
  const scenes=opt.range==='film'?S.project.scenes:[scene()];
  const w=opt.res,h=Math.round(opt.res*9/16);const c=mkCanvas(w,h),x=c.getContext('2d');
  const stream=c.captureStream(opt.fps);
  let actx=null,dest=null;
  try{actx=new(window.AudioContext||window.webkitAudioContext)();dest=actx.createMediaStreamDestination();actx.resume();}catch(e){actx=null;}
  const ep=new MediaPool(el=>{if(actx){try{actx.createMediaElementSource(el).connect(dest);}catch(e){}}});
  primeMedia(ep,scenes);
  if(dest)dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>{try{return MediaRecorder.isTypeSupported(m);}catch(e){return false;}})||'';
  let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:w>=1920?12e6:6e6}:{});}catch(e){toast('Aufnahme konnte nicht starten.');return null;}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const bar=d.querySelector('.progress');bar.hidden=false;const fill=bar.firstElementChild;
  const total=scenes.reduce((s,c)=>s+c.length/c.fps,0);let done=0,si=0,t0=0,cancelled=false,started=false;
  const ext=(rec.mimeType||mime).includes('mp4')?'mp4':'webm';
  rec.onstop=()=>{ep.clear();if(actx)actx.close();modal.dataset.lock='';if(cancelled)return;
    const blob=new Blob(chunks,{type:rec.mimeType||mime||'video/webm'});const url=URL.createObjectURL(blob);
    const out=d.querySelector('#ex-out');out.innerHTML=`<video class="result" controls playsinline src="${url}"></video><div class="btns"><button class="btn primary" id="ex-save">${icon('export')}Video speichern (${(blob.size/1048576).toFixed(1)} MB)</button></div>`;
    out.querySelector('#ex-save').onclick=()=>saveFile((S.project.name.replace(/[^\w\-äöüÄÖÜß ]+/g,'')||'Trickfilm')+'.'+ext,blob);
    d.querySelector('#ex-go').hidden=true;};
  function step(now){
    if(cancelled)return;
    if(!started){started=true;t0=now;rec.start(250);}
    let sc=scenes[si],t=(now-t0)/1000;
    if(t>=sc.length/sc.fps){ep.pauseAll();done+=sc.length/sc.fps;si++;if(si>=scenes.length){x.fillRect(0,0,0,0);setTimeout(()=>rec.stop(),120);fill.style.width='100%';return;}t0=now;t=0;sc=scenes[si];}
    x.setTransform(w/W,0,0,h/H,0,0);drawScene(x,sc,t*sc.fps,{pool:ep});syncMedia(ep,sc,t,true);
    fill.style.width=((done+t)/total*100).toFixed(1)+'%';requestAnimationFrame(step);
  }
  setTimeout(()=>requestAnimationFrame(step),400);
  return{cancel(){cancelled=true;try{rec.stop();}catch(e){}ep.clear();}};
}

/* Inventar-Zeichner */
function openEditor(item){
  const N=800;let strokes=item?offsetStrokes(item.strokes,Math.round(N/2-item.w/2),Math.round(N/2-item.h/2)):[];const hist=[];
  let tool='pen',cur=null;
  const d=openModal(`<h2>${item?'Inventar-Teil bearbeiten':'Neues Inventar-Teil zeichnen'}</h2>
    <div class="ed-wrap"><div class="ed-tools">${['pen','marker','eraser'].map(t=>`<button class="tool ${t==='pen'?'on':''}" data-ed="${t}" aria-label="${t}">${icon(t)}</button>`).join('')}
      <button class="tool" data-ed="undo" aria-label="Rückgängig">${icon('undo')}</button><button class="tool" data-ed="clear" aria-label="Leeren">${icon('trash')}</button></div>
      <canvas id="edCanvas" width="${N}" height="${N}"></canvas>
      <div class="ed-side"><div class="pal">${PAL.map(c=>`<button data-edc="${c}" style="background:${c}" class="${c===S.color?'on':''}" aria-label="Farbe ${c}"></button>`).join('')}</div>
        <div class="row"><label for="ed-c">Eigene</label><input id="ed-c" type="color" value="${S.color}"></div>
        <div class="row"><label for="ed-s">Größe</label><input id="ed-s" type="range" min="1" max="80" value="${Math.max(3,S.size)}"></div>
        <div class="row"><label for="ed-n">Name</label><input id="ed-n" class="field" value="${esc(item?item.name:'')}" placeholder="z. B. Mund offen"></div>
        <div class="row"><label for="ed-g">Gruppe</label><input id="ed-g" class="field" value="${esc(item?item.cat:(S.invCat!=='Alle'?S.invCat:'Münder'))}"></div>
        <p class="hint">${S.stylusOnly?'Nur Stift ist an: Hier zeichnet nur der Stift.':'Zeichne mit Stift oder Finger.'}</p></div></div>
    <div class="foot"><button class="btn" id="ed-cancel">Abbrechen</button><button class="btn primary" id="ed-save">Ins Inventar speichern</button></div>`,'wide');
  modal.dataset.lock='1';
  const cv=d.querySelector('#edCanvas'),cx=cv.getContext('2d');let color=S.color;
  const draw=()=>{cx.clearRect(0,0,N,N);cx.save();cx.strokeStyle='rgba(120,140,160,.35)';cx.setLineDash([8,8]);cx.beginPath();cx.moveTo(N/2,0);cx.lineTo(N/2,N);cx.moveTo(0,N/2);cx.lineTo(N,N/2);cx.stroke();cx.restore();
    const lay=mkCanvas(N,N),lx=lay.getContext('2d');strokes.forEach(s=>drawStroke(lx,s));if(cur)drawStroke(lx,cur);cx.drawImage(lay,0,0);};
  let pending=false;const req=()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;draw();});};
  draw();
  const pt=ev=>{const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)*N/r.width,y:(ev.clientY-r.top)*N/r.height};};
  cv.addEventListener('pointerdown',e=>{if(S.stylusOnly&&e.pointerType==='touch')return;if(cur)return;cv.setPointerCapture(e.pointerId);
    const sz=+d.querySelector('#ed-s').value;cur={t:tool,c:color,w:tool==='marker'?sz*1.6:sz,a:tool==='marker'?0.5:1,p:[],id:e.pointerId};add(e);req();});
  const add=e=>{const l=e.getCoalescedEvents?e.getCoalescedEvents():[];for(const ev of(l.length?l:[e])){const p=pt(ev);const f=ev.pointerType==='pen'?clamp(0.15+(ev.pressure||0.5)*1.1,0.15,1.35):1;cur.p.push(r1(p.x),r1(p.y),Math.round(f*100)/100);}};
  cv.addEventListener('pointermove',e=>{if(cur&&cur.id===e.pointerId){add(e);req();}});
  const up=e=>{if(!cur||cur.id!==e.pointerId)return;const s=cur;delete s.id;cur=null;if(s.p.length){hist.push(strokes);strokes=strokes.concat([s]);}req();};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  d.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const v=b.dataset.ed;
    if(v==='undo'){if(hist.length)strokes=hist.pop();req();}else if(v==='clear'){hist.push(strokes);strokes=[];req();}
    else{tool=v;d.querySelectorAll('[data-ed]').forEach(x=>x.classList.toggle('on',x===b));}});
  d.querySelectorAll('[data-edc]').forEach(b=>b.onclick=()=>{color=b.dataset.edc;d.querySelectorAll('[data-edc]').forEach(x=>x.classList.toggle('on',x===b));if(tool==='eraser')tool='pen';});
  d.querySelector('#ed-c').addEventListener('input',e=>{color=e.target.value;});
  d.querySelector('#ed-cancel').onclick=()=>{modal.dataset.lock='';closeModal();};
  d.querySelector('#ed-save').onclick=async()=>{
    const b=strokesBBox(strokes);if(!b){toast('Erst etwas zeichnen.');return;}
    const st=offsetStrokes(strokes,-b.x,-b.y);
    const it=item||{id:uid(),kind:'drawing',created:Date.now()};
    Object.assign(it,{name:d.querySelector('#ed-n').value.trim()||'Ohne Namen',cat:d.querySelector('#ed-g').value.trim()||'Eigene',strokes:st,w:b.w,h:b.h,thumb:makeThumb(x=>st.forEach(s=>drawStroke(x,s)),b.w,b.h)});
    await saveInv(it);modal.dataset.lock='';closeModal();S.tab='inv';S.invSel=it.id;S.invCat='Alle';renderPanel();toast('Im Inventar gespeichert');};
}

/* ---------- Beispiele für den ersten Start ---------- */
function ell(cx,cy,rx,ry,n=48,a0=0,a1=Math.PI*2,f=1){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push(r1(cx+Math.cos(a)*rx),r1(cy+Math.sin(a)*ry),f);}return p;}
function quad(x0,y0,qx,qy,x1,y1,n=26){const p=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;p.push(r1(u*u*x0+2*u*t*qx+t*t*x1),r1(u*u*y0+2*u*t*qy+t*t*y1),r1(0.6+Math.sin(t*Math.PI)*0.5));}return p;}
const pen=(p,c='#2a1a1c',w=10)=>({t:'pen',c,w,a:1,p}),poly=(p,c)=>({t:'poly',c,p});
function seedInventory(){
  const ink='#2a1a1c',dark='#5a1420',tongue='#e46b7a';
  const mouthOpen=[30,40,1,...ell(150,40,120,110,40,0,Math.PI)];
  const defs=[
    ['Lächeln','Münder',[pen(quad(20,50,150,170,280,50)),pen(quad(8,38,14,50,28,52),ink,7),pen(quad(272,52,286,50,292,38),ink,7)]],
    ['Lachen','Münder',[poly(mouthOpen,dark),poly(ell(150,118,58,18,30),tongue),poly([45,42,1,255,42,1,246,64,1,54,64,1],'#ffffff'),pen(mouthOpen,ink,8)]],
    ['O','Münder',[poly(ell(150,85,58,70),dark),poly(ell(150,128,34,14,24),tongue),pen(ell(150,85,58,70),ink,8)]],
    ['Neutral','Münder',[pen(quad(40,85,150,98,260,85))]],
    ['Traurig','Münder',[pen(quad(30,125,150,25,270,125))]],
    ['E – breit','Münder',[poly(ell(150,85,128,44),dark),poly([40,70,1,260,70,1,262,88,1,38,88,1],'#ffffff'),pen(ell(150,85,128,44),ink,8)]],
    ['Augen offen','Augen',[poly(ell(85,85,55,70),'#ffffff'),poly(ell(215,85,55,70),'#ffffff'),poly(ell(97,98,20,24),ink),poly(ell(227,98,20,24),ink),poly(ell(90,88,6,6,12),'#ffffff'),poly(ell(220,88,6,6,12),'#ffffff'),pen(ell(85,85,55,70),ink,7),pen(ell(215,85,55,70),ink,7)]],
    ['Augen zu','Augen',[pen(quad(35,90,85,128,135,90),ink,9),pen(quad(165,90,215,128,265,90),ink,9)]]
  ];
  return defs.map(([name,cat,st],i)=>({id:'seed-'+i,name,cat,kind:'drawing',strokes:st,w:300,h:170,created:i,thumb:makeThumb(x=>st.forEach(s=>drawStroke(x,s)),300,170)}));
}
function sampleProject(){
  const s1=newScene('Wiese',8,16);s1.bg='#bfe3f7';
  const ys=[260,380,560,730,800,730,560,380];
  for(let i=0;i<16;i++){const y=ys[i%8],sq=y>=800?0.82:1;const rx=70/sq*0.95,ry=70*sq;
    s1.frames[i]=[poly(ell(960,y,rx,ry),'#e5484d'),pen(ell(960,y,rx,ry,48,0,Math.PI*2,1),'#2a1a1c',7),pen(ell(940,y-ry*0.4,rx*0.35,ry*0.2,16,Math.PI*1.1,Math.PI*1.7,1),'#ffffff',8)];}
  const ground=[];for(let x=0;x<=1920;x+=60)ground.push(x,r1(60+Math.sin(x/300)*30),1);
  const gPoly=[...ground,1920,300,1,0,300,1];
  const sun=[poly(ell(150,150,90,90),'#f8c63c')];for(let k=0;k<8;k++){const a=k*Math.PI/4;sun.push(pen([r1(150+Math.cos(a)*112),r1(150+Math.sin(a)*112),1,r1(150+Math.cos(a)*140),r1(150+Math.sin(a)*140),1],'#f0a020',12));}
  s1.objects.push({id:uid(),type:'drawing',name:'Boden',w:1920,h:300,inF:0,outF:null,behind:true,flip:false,strokes:[poly(gPoly,'#7cbf5c'),pen(ground,'#4d8f3a',8)],keys:[{f:0,x:960,y:930,s:1,r:0,o:1,e:'linear'}]});
  s1.objects.push({id:uid(),type:'drawing',name:'Sonne',w:300,h:300,inF:0,outF:null,behind:true,flip:false,strokes:sun,
    keys:[{f:0,x:260,y:300,s:.7,r:0,o:1,tc:'#ff6a00',ta:0,e:'inout'},{f:15,x:600,y:190,s:.95,r:60,o:1,tc:'#ff6a00',ta:.55,e:'linear'}]});
  const s2=newScene('Nacht',12,24);s2.bg='#1b2142';
  const stars=[];for(let i=0;i<40;i++){const x=(i*397)%1880+20,y=(i*211)%640+20;stars.push(pen([x,y,1],'#fff6d0',4+(i%3)*3));}
  s2.objects.push({id:uid(),type:'drawing',name:'Sterne',w:1920,h:700,inF:0,outF:null,behind:true,flip:false,strokes:stars,keys:[{f:0,x:960,y:350,s:1,r:0,o:1,e:'linear'}]});
  s2.objects.push({id:uid(),type:'drawing',name:'Mond',w:220,h:220,inF:0,outF:null,behind:false,flip:false,strokes:[poly(ell(110,110,95,95),'#f3f0d8'),poly(ell(80,90,18,14,20),'#d9d4b4'),poly(ell(140,140,24,18,20),'#d9d4b4')],
    keys:[{f:0,x:1600,y:820,s:.6,r:0,o:.3,e:'inout'},{f:23,x:1450,y:260,s:1,r:20,o:1,e:'linear'}]});
  return{id:uid(),name:'Beispielprojekt',created:Date.now(),updated:Date.now(),scenes:[s1,s2]};
}

/* ---------- Projekt öffnen ---------- */
async function openProject(p){
  if(S.playing)stopPlayback();pool.clear();pool=new MediaPool();fcache.clear();
  S.project=p;S.si=0;S.sel=null;undoStack=[];redoStack=[];updateUndo();TL.sx=0;TL.sy=0;
  $('#projName').textContent=p.name;
  const ids=new Set();p.scenes.forEach(s=>{if(s.bgAsset)ids.add(s.bgAsset);s.objects.forEach(o=>o.assetId&&ids.add(o.assetId));s.audio.forEach(a=>ids.add(a.assetId));});
  await Promise.all([...ids].map(id=>assetUrl(id).catch(()=>null)));
  try{await DB.put('meta',{id:'last',value:p.id});}catch(e){}
  refreshScenes();setFrame(0);renderPanel();
}

/* ---------- Tastatur ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea')||!S.project||isHome()||!modal.hidden)return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return;}
  if(e.ctrlKey||e.metaKey)return;
  if(k===' '){e.preventDefault();startPlayback(false);}
  else if(k==='arrowleft'||k===','){setFrame(S.frame-1);}
  else if(k==='arrowright'||k==='.'){setFrame(S.frame+1);}
  else if(k==='k')setKey();
  else if(k==='delete'||k==='backspace'){if(S.sel)A.objDel();}
  else{const m={v:'select',b:'pen',m:'marker',e:'eraser',f:'fill',h:'hand'}[k];if(m)setTool(m);}
});

/* ---------- Start ---------- */
async function init(){
  document.querySelectorAll('[data-ic]').forEach(b=>b.insertAdjacentHTML('afterbegin',icon(b.dataset.ic)));
  $('#undoBtn').innerHTML=icon('undo');$('#redoBtn').innerHTML=icon('redo');updatePlayBtn();
  if(innerWidth<=1100)$('#app').classList.remove('nopanel');
  readTokens();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTokens);
  new MutationObserver(readTokens).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  if(document.fonts)document.fonts.ready.then(()=>{readTokens();});
  renderTools();updateModeUI();
  new ResizeObserver(()=>{resizeStage();}).observe($('#stageWrap'));
  new ResizeObserver(()=>{resizeTl();}).observe($('#tlWrap'));
  resizeStage();resizeTl();
  await DB.open();
  try{inventory=await DB.all('inventory');}catch(e){inventory=[];}
  let meta=null;try{meta=await DB.get('meta','seeded');}catch(e){}
  if(!meta){const seeds=seedInventory();for(const s of seeds)await saveInv(s);try{await DB.put('meta',{id:'seeded',value:true});}catch(e){}}
  let projects=[];try{projects=await DB.all('projects');}catch(e){}
  if(!projects.length){const p=sampleProject();await DB.put('projects',p);}
  await showHome();
  if(document.querySelector('meta[name="tfs-pwa"]')&&'serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('Neue Version geladen. Schließe die App und öffne sie neu.');});});
    }).catch(()=>{});
  }
}
init();
})();
</script>
